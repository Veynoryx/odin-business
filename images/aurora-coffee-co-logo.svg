<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Coffee Co. logo</title>
  <desc id="desc">A minimalist coffee cup with aurora-shaped steam above the words Aurora Coffee Co.</desc>

  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89B6D"/>
      <stop offset="50%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#F5E6D3"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="none"/>

  <!-- Icon -->
  <g transform="translate(70 35)">
    <!-- steam / aurora -->
    <path d="M70 18
             C50 0, 18 8, 18 32
             C18 52, 40 58, 58 48
             C78 38, 98 42, 108 58"
          fill="none" stroke="url(#aurora)" stroke-width="8" stroke-linecap="round"/>
    <path d="M102 14
             C86 2, 62 4, 58 22
             C54 38, 68 48, 86 44
             C102 40, 118 48, 126 62"
          fill="none" stroke="#C89B6D" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- cup -->
    <rect x="22" y="78" width="92" height="52" rx="10" fill="none" stroke="#3E2723" stroke-width="8"/>
    <path d="M114 90
             C140 88, 148 98, 148 108
             C148 119, 140 129, 120 126"
          fill="none" stroke="#3E2723" stroke-width="8" stroke-linecap="round"/>
    <path d="M14 138 H124" fill="none" stroke="#3E2723" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(250 78)">
    <text x="0" y="0"
          fill="#3E2723"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="42"
          font-weight="700"
          letter-spacing="0.5">
      Aurora Coffee Co.
    </text>
    <text x="2" y="38"
          fill="#A47148"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          letter-spacing="3">
      BREWED TO PERFECTION
    </text>
  </g>
</svg>
